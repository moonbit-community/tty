name: embedded sidecars

# Runs the pty tests in tests/ against the sidecar executables embedded in
# internal/sidecar/sidecars.generated.mbt, one runner per embedded
# `<os>-<arch>`. The regular CI runs them against a sidecar compiled from
# sidecar/sidecar.c instead. The sidecars workflow pushes a regenerated table
# with a deploy key, so that push triggers this workflow too.

on:
  pull_request:
    paths:
      - internal/sidecar/**
      - tests/**
      - .github/workflows/embedded-sidecars.yml
  push:
    branches:
      - main
    paths:
      - internal/sidecar/**
      - tests/**
      - .github/workflows/embedded-sidecars.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x86_64
            os: ubuntu-latest
          - key: linux-arm64
            os: ubuntu-24.04-arm
          - key: macos-arm64
            os: macos-latest
          - key: macos-x86_64
            os: macos-15-intel
          - key: windows-x86_64
            os: windows-latest
    env:
      TTY_TEST_SIDECAR: embedded

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runners are still native and wasm programs built on the host.
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"MOON_CC=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Install MoonBit
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$HOME/.moon" >> "$GITHUB_ENV"

      - name: Install MoonBit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MOON_HOME=$env:USERPROFILE\.moon" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show MoonBit version
        run: moon version --all

      - name: Update package registry
        run: moon update

      # `platform_key` in internal/sidecar/locate.mbt picks the embedded
      # executable from `uname -m` (Unix) or PROCESSOR_ARCHITECTURE
      # (Windows); make sure the runner is the platform the job is named for.
      - name: Check the runner platform
        shell: bash
        run: |
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=macos ;;
            MINGW*|MSYS*) os=windows ;;
            *) os=unknown ;;
          esac
          if [ "$os" = windows ]; then
            arch=$([ "$PROCESSOR_ARCHITECTURE" = ARM64 ] && echo arm64 || echo x86_64)
          else
            case "$(uname -m)" in
              aarch64|arm64) arch=arm64 ;;
              x86_64|amd64) arch=x86_64 ;;
              *) arch="$(uname -m)" ;;
            esac
          fi
          echo "runner platform: $os-$arch"
          test "$os-$arch" = "${{ matrix.key }}"

      - name: Run the pty tests against the embedded sidecar
        run: moon test tests --deny-warn
